<style>
/* Layout: one portrait arcade cabinet screen, centered, with on-screen throw pads on touch devices. Single night-festival look by design. */
:root{
  --night:#0c0a1e; --panel:#17132f; --line:#2b2552; --ink:#f1edff; --dim:#a7a1c9;
  --cyan:#33dcff; --cyan-deep:#0d7a99; --amber:#ffb340; --pink:#ff4fa8;
  --display:'Bungee','Arial Black',Impact,sans-serif;
  --pixel:'Silkscreen','Courier New',monospace;
  --body:'Chakra Petch',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{
  box-sizing:border-box; margin:0; overflow:hidden;
  background:var(--night);
  background-image:radial-gradient(ellipse at 50% 0%,rgba(255,79,168,.14),transparent 60%),radial-gradient(ellipse at 50% 100%,rgba(51,220,255,.10),transparent 55%);
  color:var(--ink); font-family:var(--body);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  padding-top:max(12px,env(safe-area-inset-top,0px));
  padding-bottom:max(12px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.stage{position:relative; border-radius:8px; box-shadow:0 0 0 2px var(--line),0 24px 70px rgba(51,220,255,.14); overflow:hidden}
canvas{display:block; touch-action:none; background:var(--night)}
.ov{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:18px; background:rgba(10,8,26,.74); backdrop-filter:blur(2px); overflow:auto}
.card{max-width:290px; width:100%; text-align:center; display:flex; flex-direction:column; align-items:center; gap:12px}
.eyebrow{font-family:var(--pixel); font-size:11px; letter-spacing:.08em; color:var(--amber); text-transform:uppercase}
h1{font-family:var(--display); font-weight:400; font-size:clamp(36px,12vw,54px); line-height:.88; margin:0; color:var(--cyan); text-shadow:3px 3px 0 var(--pink); text-wrap:balance}
h2{font-family:var(--display); font-weight:400; font-size:clamp(24px,8vw,32px); line-height:1; margin:0; color:var(--ink); text-shadow:2px 2px 0 var(--pink); text-wrap:balance}
p{margin:0; font-size:14px; line-height:1.4; color:var(--ink)}
.how{display:grid; gap:6px; width:100%; text-align:left; font-size:13px; line-height:1.35; color:var(--dim)}
.how b{color:var(--ink); font-weight:600}
.key{font-family:var(--pixel); font-size:11px; color:var(--night); background:var(--ink); border-radius:3px; padding:0 4px}
.sw{display:inline-block; width:10px; height:10px; border-radius:2px; vertical-align:-1px; margin-right:4px}
.stats{display:grid; grid-template-columns:1fr auto; gap:4px 14px; width:100%; margin:0; font-size:14px; text-align:left}
.stats dt{color:var(--dim)} .stats dd{margin:0; font-family:var(--pixel); font-variant-numeric:tabular-nums; text-align:right}
.stats .total{color:var(--cyan); font-size:16px}
.hi{font-family:var(--pixel); font-size:11px; color:var(--dim); letter-spacing:.06em}
.btn{font-family:var(--display); font-size:18px; padding:12px 20px; border:0; border-radius:8px; background:var(--cyan); color:#06101a; box-shadow:0 4px 0 var(--cyan-deep),0 0 26px rgba(51,220,255,.4); cursor:pointer; touch-action:manipulation}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--cyan-deep),0 0 20px rgba(51,220,255,.3)}
.btn:focus-visible,.mini:focus-visible,.pad:focus-visible{outline:3px solid var(--amber); outline-offset:3px}
.mini{position:absolute; left:8px; bottom:8px; font-family:var(--pixel); font-size:10px; letter-spacing:.06em; color:var(--dim); background:rgba(12,10,30,.7); border:1px solid var(--line); border-radius:5px; padding:4px 7px; cursor:pointer}
.touch{display:none; gap:12px}
.pad{flex:1; font-family:var(--display); font-size:17px; padding:16px 0; border:0; border-radius:10px; color:#06101a; background:var(--amber); box-shadow:0 4px 0 #9a5f0c; touch-action:none; user-select:none; -webkit-user-select:none}
.pad:active{transform:translateY(3px); box-shadow:0 1px 0 #9a5f0c}
.links{display:flex; flex-wrap:wrap; justify-content:center; gap:6px 14px; font-size:13px}
.links a{color:var(--cyan); text-underline-offset:3px}
.links a:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
.tc{display:none}
@media (pointer:coarse){ .touch{display:flex} .kb{display:none} .tc{display:inline} }
@media (prefers-reduced-motion:reduce){ .btn:active,.pad:active{transform:none} }

<body>
<div class="stage" id="stage">
  <canvas id="game" width="360" height="640" aria-label="Crate Runner game screen"></canvas>
  <button class="mini" id="mus" type="button">Music: on</button>
  <div class="ov" id="ov"><div class="card" id="card"></div></div>
</div>
<div class="touch" id="touch">
  <button class="pad" id="tl" type="button">◀ Throw</button>
  <button class="pad" id="tr" type="button">Throw ▶</button>
</div>

<script>
const W=360,H=640,PL=84,PR=276,PY=500;
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const stage=document.getElementById('stage'),ov=document.getElementById('ov'),card=document.getElementById('card');
const touchBar=document.getElementById('touch'),musBtn=document.getElementById('mus');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.random()*a.length|0], clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hash(n){n=Math.imul(n^0x5bd1e995,0x27d4eb2d);n^=n>>>15;n=Math.imul(n,0x85ebca6b);n^=n>>>13;return (n>>>0)/4294967296}

let scale=1;
function resize(){
  const tb=getComputedStyle(touchBar).display!=='none'?touchBar.offsetHeight+10:0;
  const availH=window.innerHeight-24-tb, availW=Math.min(window.innerWidth-32,460);
  const w=Math.max(220,Math.min(availW,availH*W/H));
  for(const el of [stage,cv]){el.style.width=w+'px';el.style.height=(w*H/W)+'px'}
  touchBar.style.width=w+'px';
  scale=w/W*Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(W*scale); cv.height=Math.round(H*scale);
}
addEventListener('resize',resize); resize();

const DAYS=[
  {name:'Friday',short:'FRI',sub:'Gates open. Easy crowd, wide paths.',speed:125,booths:14,obsGap:210},
  {name:'Saturday',short:'SAT',sub:'Sold out. Golf carts are on the move.',speed:150,booths:16,obsGap:165},
  {name:'Sunday',short:'SUN',sub:'Closing night. Everybody is out.',speed:175,booths:18,obsGap:135}];
const DJS=['NOVA','KAIJU','MARLO','JUNO','ECHO','ZEPH','LUMA','ORBIT','TIDE','ROXI','KOJI','SABLE','VEGA','RUMI'];
const TENTS=[['#1fb6e0','#0f5f86'],['#ff4fa8','#7b1d58'],['#8f6bff','#3d2a8a'],['#2fe0a6','#0f6b55']];
const VENDORS=[{n:'TACOS',a:'#ff8a3d',b:'#8a3d12'},{n:'MERCH',a:'#c9c3e0',b:'#4d476b'},{n:'LEMON',a:'#ffe14d',b:'#8a7412'},{n:'PIZZA',a:'#ff5f4d',b:'#7d2016'},{n:'WATER',a:'#7fd3ff',b:'#2c5f80'},{n:'GLOW',a:'#b6ff5c',b:'#4d7a12'}];
const SHIRTS=['#ff4fa8','#ffb340','#33dcff','#b6ff5c','#f1edff','#8f6bff','#ff5f4d'];
const SKINS=['#f1c8a5','#d9a37e','#a8714f','#7a4b31','#e8b896'];
const LABELS=['#ff4fa8','#ffb340','#33dcff','#b6ff5c','#8f6bff'];
const BULBS=['#ff4fa8','#ffb340','#33dcff','#b6ff5c'];

/* ---------- audio ---------- */
let AC=null,master=null,noiseBuf=null,musicOn=true;
function audio(){
  try{
    if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.45;master.connect(AC.destination)}
    if(AC.state==='suspended')AC.resume();
  }catch(e){AC=null}
}
const now=()=>AC?AC.currentTime:0;
function osc(type,f0,f1,t,dur,vol){
  if(!AC)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);
  if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(master);o.start(t);o.stop(t+dur+.05);
}
function nz(t,dur,vol,freq,type='highpass'){
  if(!AC)return;
  if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate*.5|0,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=noiseBuf;f.type=type;f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(master);s.start(t);s.stop(t+dur+.02);
}
const SFX={
  throw(){const t=now();nz(t,.12,.22,2600,'bandpass');osc('triangle',900,380,t,.1,.07)},
  deliver(){const t=now();osc('square',523,523,t,.08,.07);osc('square',784,784,t+.07,.14,.07)},
  bull(){const t=now();[523,659,784,1047].forEach((f,i)=>osc('square',f,f,t+i*.06,.11,.07))},
  vendor(){const t=now();osc('sine',240,110,t,.14,.14);nz(t,.07,.14,900,'lowpass')},
  fan(){const t=now();osc('triangle',660,990,t,.12,.08)},
  hit(){const t=now();osc('sawtooth',170,40,t,.45,.18);nz(t,.3,.28,600,'lowpass')},
  pickup(){const t=now();osc('triangle',440,880,t,.14,.11);osc('triangle',660,1320,t+.08,.15,.09)},
  miss(){const t=now();osc('square',330,200,t,.28,.06)},
  slip(){const t=now();osc('sine',700,150,t,.4,.11)},
  empty(){const t=now();osc('square',110,110,t,.07,.06)},
  fanfare(){const t=now();[392,523,659,784,659,1047].forEach((f,i)=>osc('square',f,f,t+i*.11,.16,.07))}
};
function sfx(n){try{SFX[n]()}catch(e){}}
const SIX=60/124/4,BASS=[36,0,0,36,0,0,48,0,36,0,0,36,0,46,0,43];
let nextT=0,stepN=0;
const mtof=m=>440*Math.pow(2,(m-69)/12);
function bassNote(t,m){
  const o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();
  o.type='sawtooth';o.frequency.value=mtof(m);f.type='lowpass';
  f.frequency.setValueAtTime(1100,t);f.frequency.exponentialRampToValueAtTime(180,t+.16);
  g.gain.setValueAtTime(.09,t);g.gain.exponentialRampToValueAtTime(.0001,t+.2);
  o.connect(f).connect(g).connect(master);o.start(t);o.stop(t+.22);
}
setInterval(()=>{
  if(!AC)return;
  if(!musicOn||S.state!=='play'){nextT=AC.currentTime+.05;return}
  if(nextT<AC.currentTime)nextT=AC.currentTime+.05;
  try{
    while(nextT<AC.currentTime+.12){
      const s=stepN%16,bar=Math.floor(stepN/16)%4;
      if(s%4===0)osc('sine',140,42,nextT,.18,.42);
      if(s%4===2)nz(nextT,.04,.06,7000);
      if(s===4||s===12)nz(nextT,.12,.11,1500,'bandpass');
      if(BASS[s])bassNote(nextT,BASS[s]+(bar===2?5:bar===3?3:0));
      nextT+=SIX;stepN++;
    }
  }catch(e){}
},25);

/* ---------- state ---------- */
let S,P,booths,obs,pickups,albums,fx,texts,finish;
const keys={};
let touchX=null,touchId=null;
let hi=0;try{hi=+localStorage.getItem('crate-runner-hi')||0}catch(e){}
function saveHi(){if(S.score>hi){hi=S.score;try{localStorage.setItem('crate-runner-hi',hi)}catch(e){}}}

function newGame(){S={score:0,lives:3,day:0,state:'title',time:0,shake:0,timer:0};startDay()}
function startDay(){
  Object.assign(S,{dist:0,scroll:0,nextBooth:40,spawned:0,clients:0,delivered:0,bulls:0,missed:0,combo:0,albums:12,lastSide:0,sameSide:0,emptyT:0});
  P={x:W/2,vx:0,tilt:0,inv:0,cd:0,throwT:0,throwDir:1,slip:0,slipDir:1,bob:0};
  booths=[];obs=[];pickups=[];albums=[];fx=[];texts=[];finish=null;
  for(let i=0;i<200;i++)step(1/60,true);
  S.nextObs=S.dist+140;S.nextPickup=S.dist+450;
}
function say(x,y,s,c,big){texts.push({x,y,s,c,big,t:0})}
function burst(x,y,c,n){for(let i=0;i<(RM?n/3:n);i++){const a=rand(0,Math.PI*2),v=rand(40,150);fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.4,.8),c,sz:rand(1.5,3)})}}

function spawnBooth(){
  let side=Math.random()<.5?-1:1;
  if(side===S.lastSide){if(++S.sameSide>=2){side=-side;S.sameSide=0}}else S.sameSide=0;
  S.lastSide=side;
  let y=-60;
  for(const o of booths)if(o.side===side)y=Math.min(y,o.y-94);
  const b={side,y,t:0,client:Math.random()<.68,delivered:false,hits:0};
  if(b.client){b.name=pick(DJS);b.tent=pick(TENTS);S.clients++}else b.v=pick(VENDORS);
  booths.push(b);S.spawned++;
}
function spawnObstacle(){
  const r=Math.random();
  if(S.day>=1&&r<.18){const fromL=Math.random()<.5;obs.push({t:'cart',x:fromL?-30:W+30,y:-30,vx:(fromL?1:-1)*rand(70,110),r:15});return}
  if(r<.5)obs.push({t:'fan',x:rand(PL+14,PR-14),y:-20,vx:rand(-30,30),vy:rand(5,25),r:9,c:pick(SHIRTS),sk:pick(SKINS),gc:pick(BULBS),ph:rand(0,6)});
  else if(r<.66)obs.push({t:'cooler',x:rand(PL+16,PR-16),y:-20,r:11});
  else if(r<.83)obs.push({t:'ball',x:rand(PL+14,PR-14),y:-20,vx:rand(50,90)*(Math.random()<.5?-1:1),r:9,ph:0,z:0});
  else obs.push({t:'slick',x:rand(PL+22,PR-22),y:-20,r:14});
}

function throwAlbum(dir){
  if(S.state!=='play')return;
  if(P.cd>0)return;
  if(S.albums<=0){sfx('empty');if(S.emptyT<=0){say(P.x,PY-30,'OUT OF RECORDS','#ff4fa8');S.emptyT=1.2}return}
  S.albums--;P.cd=.22;P.throwT=.18;P.throwDir=dir;
  albums.push({x:P.x+dir*10,y:PY-6,vx:dir*330,rot:0,c:pick(LABELS)});
  sfx('throw');
}

function hitBooth(b,a){
  const bx=b.side<0?50:W-50;
  if(!b.client){
    b.hits++;S.score+=25;say(bx,b.y-22,pick(['OOPS +25','NOT A DJ','WRONG TENT']),'#ffb340');burst(b.side<0?80:280,a.y,'#ffb340',10);sfx('vendor');return;
  }
  if(b.delivered){say(bx,b.y-22,'ALREADY SET','#a7a1c9');sfx('vendor');return}
  b.delivered=true;S.delivered++;S.combo=Math.min(S.combo+1,4);
  const bull=Math.abs(a.y-b.y)<=12;
  let pts=200*S.combo;if(bull){pts+=300;S.bulls++}
  S.score+=pts;
  say(bx,b.y-24,(bull?'BULLSEYE ':'')+'+'+pts,bull?'#ffb340':'#33dcff',bull);
  burst(b.side<0?78:282,b.y,bull?'#ffb340':'#33dcff',bull?28:16);
  sfx(bull?'bull':'deliver');
}
function crash(o){
  S.lives--;P.inv=2;S.shake=.35;S.combo=0;
  if(o.t==='fan'||o.t==='ball')o.dead=true;
  say(P.x,PY-34,'WIPEOUT!','#ff4fa8',true);burst(P.x,PY,'#ff4fa8',20);sfx('hit');
  if(S.lives<=0){S.state='dying';S.timer=1.3;saveHi()}
}

function step(dt,warm){
  const d=DAYS[S.day];
  let sp=d.speed;
  if(!warm){
    if(keys.up)sp+=70;if(keys.down)sp-=55;
    let dir=(keys.left?-1:0)+(keys.right?1:0);
    if(touchX!==null){const diff=touchX-P.x;dir=Math.abs(diff)<3?0:clamp(diff/20,-1,1)}
    if(P.slip>0){P.slip-=dt;dir=P.slipDir}
    P.vx+=(dir*240-P.vx)*Math.min(1,dt*9);
  }
  P.x=clamp(P.x+P.vx*dt,PL+12,PR-12);
  P.tilt=P.vx/240*.3;P.bob+=dt*6;
  P.inv=Math.max(0,P.inv-dt);P.cd=Math.max(0,P.cd-dt);P.throwT=Math.max(0,P.throwT-dt);S.emptyT-=dt;
  const dy=sp*dt;S.dist+=dy;S.scroll+=dy;

  if(S.spawned<d.booths&&S.dist>=S.nextBooth){spawnBooth();S.nextBooth+=rand(115,190)-S.day*10}
  else if(S.spawned>=d.booths&&!finish&&S.dist>=S.nextBooth+40)finish={y:-60};
  if(!warm&&!finish){
    if(S.dist>=S.nextObs){spawnObstacle();S.nextObs+=d.obsGap*rand(.6,1.4)}
    if(S.dist>=S.nextPickup){pickups.push({x:rand(PL+18,PR-18),y:-20,ph:0});S.nextPickup+=rand(650,1000)}
  }

  for(const b of booths){
    b.y+=dy;b.t+=dt;
    if(b.client&&b.delivered&&Math.random()<dt*2.2)fx.push({note:true,x:(b.side<0?64:W-64)+rand(-6,6),y:b.y,vx:rand(-8,8),vy:-30,life:1.2,c:pick(LABELS)});
    if(b.y-42>H){b.dead=true;if(b.client&&!b.delivered&&!warm){S.missed++;S.combo=0;say(b.side<0?60:W-60,H-70,'MISSED '+b.name,'#ff4fa8');sfx('miss')}}
  }
  for(const o of obs){
    o.y+=dy;
    if(o.t==='fan'){o.y+=o.vy*dt;o.x+=o.vx*dt;o.ph+=dt*8;if(o.x<PL+10||o.x>PR-10){o.vx*=-1;o.x=clamp(o.x,PL+10,PR-10)}if(Math.random()<dt*.4)o.vx=rand(-35,35)}
    else if(o.t==='cart'){o.x+=o.vx*dt;if((o.vx>0&&o.x>W+40)||(o.vx<0&&o.x<-40))o.dead=true}
    else if(o.t==='ball'){o.x+=o.vx*dt;o.ph+=dt*5;if(o.x<PL+9||o.x>PR-9){o.vx*=-1;o.x=clamp(o.x,PL+9,PR-9)}o.z=Math.abs(Math.sin(o.ph))*16}
    if(o.y>H+40)o.dead=true;
  }
  for(const p of pickups){p.y+=dy;p.ph+=dt;if(p.y>H+30)p.dead=true}
  if(finish)finish.y+=dy;

  for(const a of albums){
    a.x+=a.vx*dt;a.rot+=dt*22;
    for(const b of booths){
      if(b.dead||Math.abs(a.y-b.y)>42)continue;
      if((b.side<0&&a.vx<0&&a.x-7<=80)||(b.side>0&&a.vx>0&&a.x+7>=280)){hitBooth(b,a);a.dead=true;break}
    }
    if(a.dead)continue;
    for(const o of obs){
      if(o.t!=='fan'||o.dead)continue;
      if(Math.hypot(a.x-o.x,a.y-o.y)<o.r+7){a.dead=true;if(!o.got){o.got=true;S.score+=50;say(o.x,o.y-16,'FAN +50','#b6ff5c');sfx('fan')}break}
    }
    if(a.x<8||a.x>W-8){a.dead=true;burst(a.x,a.y,'#6b6590',5)}
  }

  if(!warm&&S.state==='play'){
    for(const o of obs){
      if(o.dead||(o.t==='ball'&&o.z>6))continue;
      if(Math.hypot(o.x-P.x,o.y-PY)<o.r+10){
        if(o.t==='slick'){if(!o.used){o.used=true;P.slip=.6;P.slipDir=Math.random()<.5?-1:1;say(P.x,PY-30,'SPILLED DRINK!','#7fd3ff');sfx('slip')}continue}
        if(P.inv<=0){crash(o);if(S.state!=='play')break}
      }
    }
    for(const p of pickups){
      if(!p.dead&&Math.hypot(p.x-P.x,p.y-PY)<22){p.dead=true;S.albums=Math.min(20,S.albums+6);say(p.x,PY-30,'+6 RECORDS','#ffb340');burst(p.x,PY,'#ffb340',14);sfx('pickup')}
    }
    if(finish&&finish.y>=PY)endDay();
  }
  updFx(dt,dy);
  booths=booths.filter(x=>!x.dead);obs=obs.filter(x=>!x.dead);pickups=pickups.filter(x=>!x.dead);albums=albums.filter(x=>!x.dead);
}
function updFx(dt,dy){
  for(const f of fx){f.x+=f.vx*dt;f.y+=f.vy*dt+dy;f.life-=dt;if(!f.note){f.vx*=.92;f.vy*=.92}}
  fx=fx.filter(f=>f.life>0);
  for(const t of texts)t.t+=dt;
  texts=texts.filter(t=>t.t<1.2);
}

const KMAP={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down'};
addEventListener('keydown',e=>{
  if(KMAP[e.key]){keys[KMAP[e.key]]=true;e.preventDefault()}
  if(e.repeat)return;
  const k=e.key.toLowerCase();
  if(k==='z'||k==='q'||k===',')throwAlbum(-1);
  if(k==='x'||k==='e'||k==='.')throwAlbum(1);
  if(k==='p'||e.key==='Escape')pause();
  if(k==='m')toggleMusic();
  if((e.key===' '||e.key==='Enter')&&!ov.hidden){const go=document.getElementById('go');if(go&&document.activeElement!==go){e.preventDefault();go.click()}}
  if(e.key===' ')e.preventDefault();
});
addEventListener('keyup',e=>{if(KMAP[e.key])keys[KMAP[e.key]]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;pause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
const toGame=e=>{const r=cv.getBoundingClientRect();return (e.clientX-r.left)/r.width*W};
cv.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;touchId=e.pointerId;touchX=toGame(e);audio()});
cv.addEventListener('pointermove',e=>{if(e.pointerId===touchId)touchX=toGame(e)});
for(const ev of ['pointerup','pointercancel'])cv.addEventListener(ev,e=>{if(e.pointerId===touchId){touchId=null;touchX=null}});
for(const [id,dir] of [['tl',-1],['tr',1]]){

function drawGround(){

      ctx.strokeStyle='#33dcff';ctx.lineWidth=1.5;ctx.setLineDash([3,3]);ctx.beginPath();ctx.arc(78,0,10,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle='#33dcff';circ(78,0,2);

function drawObs(o){

    if(o.got){ctx.fillStyle='#08060f';circ(o.x-8,o.y-3,4);ctx.fillStyle='#ffb340';circ(o.x-8,o.y-3,1.4)}
    return;
  }
  if(o.t==='cooler'){

    ctx.fillStyle='#2f7fd6';ctx.fillRect(o.x-11,o.y-8,22,16);ctx.fillStyle='#e9f1ff';ctx.fillRect(o.x-11,o.y-8,22,6);

    ctx.fillStyle='#e8e8ee';ctx.fillRect(o.x-16,o.y-10,32,20);
    ctx.fillStyle='#3a3456';ctx.fillRect(o.x-10,o.y-9,20,18);

  ctx.textAlign='center';const d=DAYS[S.day];
  ctx.fillStyle='#ffb340';ctx.font='10px Silkscreen, monospace';ctx.fillText(d.name.toUpperCase(),W/2,15);
  ctx.fillStyle='#a7a1c9';ctx.font='7px Silkscreen, monospace';ctx.fillText(`DJS ${S.delivered}/${S.clients}`,W/2,28);
  ctx.fillStyle='#08060f';circ(W-62,14,6);ctx.strokeStyle='#5a5480';ctx.lineWidth=1;ctx.beginPath();ctx.arc(W-62,14,6,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#33dcff';circ(W-62,14,2);
  ctx.textAlign='left';ctx.fillStyle=S.albums?'#f1edff':'#ff4fa8';ctx.font='11px Silkscreen, monospace';ctx.fillText('×'+S.albums,W-52,18);
  for(let i=0;i<3;i++){ctx.fillStyle=i<S.lives?'#33dcff':'#2b2552';rrect(W-64+i*18,24,14,6,3);ctx.fill()}
  if(S.combo>1&&S.state==='play'){ctx.textAlign='center';ctx.fillStyle='#ffb340';ctx.font='10px Silkscreen, monospace';ctx.fillText(`COMBO ×${S.combo}`,W/2,52)}
}
function render(){
  ctx.setTransform(scale,0,0,scale,0,0);
  ctx.save();
  if(S.shake>0&&!RM)ctx.translate(rand(-1,1)*S.shake*14,rand(-1,1)*S.shake*14);
  drawGround();drawLights();
  for(const b of booths)drawBooth(b);
  if(finish)drawFinish();
  for(const p of pickups)drawPickup(p);
  for(const o of obs)if(o.t==='slick')drawObs(o);
  for(const o of [...obs].sort((a,b)=>a.y-b.y))if(o.t!=='slick')drawObs(o);
  for(const a of albums)drawAlbum(a);
  if(S.state!=='over')drawPlayer();
  ctx.globalCompositeOperation='lighter';
  for(const f of fx){
    ctx.globalAlpha=Math.min(1,f.life*2);ctx.fillStyle=f.c;
    if(f.note){ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('♪',f.x,f.y)}else ctx.fillRect(f.x,f.y,f.sz,f.sz);
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.restore();
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
  for(const t of texts){
    ctx.globalAlpha=Math.min(1,(1.2-t.t)*2.5);
    ctx.font=t.big?'14px Bungee, Impact, sans-serif':'9px Silkscreen, monospace';
    const x=clamp(t.x,46,W-46),y=t.y-t.t*28;
    ctx.strokeStyle='#08060f';ctx.lineWidth=3;ctx.strokeText(t.s,x,y);ctx.fillStyle=t.c;ctx.fillText(t.s,x,y);
  }
  ctx.globalAlpha=1;
  if(!vignette){vignette=ctx.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.75);vignette.addColorStop(0,'rgba(5,3,15,0)');vignette.addColorStop(1,'rgba(5,3,15,.55)')}
  ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H);
  drawHUD();
}

let last=performance.now();
function loop(t){
  const dt=Math.min(.033,(t-last)/1000);last=t;
  S.time+=dt;
  if(S.state==='play')step(dt,false);
  else if(S.state==='dying'){S.timer-=dt;updFx(dt,0);if(S.timer<=0)gameOver()}
  S.shake=Math.max(0,S.shake-dt);
  render();
  requestAnimationFrame(loop);
}
newGame();titleScreen();
document.fonts?.ready.then(resize);
requestAnimationFrame(loop);
</script>
</body>
</html>
