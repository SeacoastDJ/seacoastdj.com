  <style>
    .hero{

color:white;
text-align:center;

}

line-height:1;

}

.hero-content{

position:relative;
z-index:2;

}

.btn-main{

padding:18px 38px;
background:linear-gradient(90deg,#FFD56A,#FF9F1C);
border-radius:999px;
text-decoration:none;
color:black;
font-weight:700;
transition:.35s;

}

.btn-main:hover{

transform:translateY(-4px);
box-shadow:0 20px 60px rgba(255,190,60,.4);

}

.btn-secondary{

padding:18px 38px;
border:1px solid rgba(255,255,255,.2);
backdrop-filter:blur(15px);
border-radius:999px;
margin-left:15px;
text-decoration:none;
color:white;

}

.aurora{

position:absolute;
width:160%;
height:160%;
background:
radial-gradient(circle,#ffbf0070 0%,transparent 40%),
radial-gradient(circle,#00bfff40 0%,transparent 35%),
radial-gradient(circle,#ff007760 0%,transparent 40%);
animation:move 16s infinite alternate;
filter:blur(120px);

}

@keyframes move{

0%{
transform:translate(-15%,-15%) rotate(0deg);
}

100%{
transform:translate(15%,15%) rotate(35deg);
}

}

.scroll-indicator{

position:absolute;
bottom:30px;
font-size:24px;
animation:bounce 2s infinite;

}

@keyframes bounce{

50%{
transform:translateY(10px);
}

}

#cursor-glow{
position:fixed;
width:350px;
height:350px;
border-radius:50%;
background:radial-gradient(circle,
rgba(255,170,50,.18),
transparent 70%);
pointer-events:none;
transform:translate(-50%,-50%);
z-index:0;
}
.glass{
background:rgba(255,255,255,.06);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.08);
border-radius:24px;
padding:40px;
transition:.4s;
}
.glass:hover{
transform:translateY(-8px);

}

white,
gold,
white);
